architecture: replication
auth:
  database: mydb
  username: myuser
  existingSecret: mysql-creds


secondary:
  replicaCount: 2
  persistence:
    accessModes: ["ReadWriteOnce"]
    enabled: true
    storageClass: gp3
    size: 10Gi


global:
  security:
    allowInsecureImages: True

image: 
  registry: docker.io
  tag: latest
  repository: bitnamilegacy/mysql

volumePermissions:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/os-shell
    tag: 12-debian-12-r50